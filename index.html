<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignIn&SignUp</title>
    <link rel="stylesheet" type="text/css" href="./style.css" />
    <script
      src="https://kit.fontawesome.com/64d58efce2.js"
      crossorigin="anonymous"
    ></script>
  
  </head>
  <body>
    <div class="container">
      <div class="forms-container">
        <div class="signin-signup">
          <form action="" class="sign-in-form" id="signin-form">
            <h2 class="title">Sign In</h2>
            <div class="form-message" id="signin-message"></div>
            <div class="input-field">
              <i class="fas fa-envelope"></i>
              <input type="email" placeholder="Email" id="signin-email" required />
            </div>
            <div class="input-field">
              <i class="fas fa-lock"></i>
              <input type="password" placeholder="Password" id="signin-password" required />
            </div>
            <input type="submit" value="Login" class="btn solid" />
          </form>


          <form action="" class="sign-up-form" id="signup-form">
            <h2 class="title">Sign Up</h2>
            <div class="form-message" id="signup-message"></div>
            <div class="input-field">
              <i class="fas fa-user"></i>
              <input type="text" placeholder="Username" id="signup-username" required />
            </div>
            <div class="input-field">
              <i class="fas fa-envelope"></i>
              <input type="email" placeholder="Email" id="signup-email" required />
            </div>
            <div class="input-field">
              <i class="fas fa-lock"></i>
              <input type="password" placeholder="Password" id="signup-password" required />
            </div>
            <input type="submit" value="Sign Up" class="btn solid" />
          </form>
        </div>
      </div>
      <div class="panels-container">

        <div class="panel left-panel">
            <div class="content">
                <h3>New here?</h3>
              <p>Join us today</p>
                <button class="btn transparent" id="sign-up-btn">Sign Up</button>
            </div>
            <img src="./img/logN.svg" class="image" alt="">
        </div>

        <div class="panel right-panel">
            <div class="content">
                <h3>One of us or just create an account ?</h3>
              <p>come over here</p>
                <button class="btn transparent" id="sign-in-btn">Sign In</button>
            </div>
            <img src="./img/registerN.svg" class="image" alt="">
        </div>
      </div>

      <div class="theme-switcher" aria-label="Theme selector">
        <button class="theme-toggle" type="button" aria-expanded="false" aria-controls="theme-menu" title="Themes">
          <i class="fas fa-palette"></i>
        </button>
        <div class="theme-menu" id="theme-menu">
          <button class="theme-option active" type="button" data-theme="theme-red-black" title="Red / Black" aria-label="Red and black theme" style="--swatch-a: #93032e; --swatch-b: #151515;">
            <span class="theme-swatch"></span>
          </button>
          <button class="theme-option" type="button" data-theme="theme-wine-cream" title="Wine / Cream" aria-label="Wine and cream theme" style="--swatch-a: #53161d; --swatch-b: #fffbf0;">
            <span class="theme-swatch"></span>
          </button>
          <button class="theme-option" type="button" data-theme="theme-navy-cream" title="Navy / Cream" aria-label="Navy and cream theme" style="--swatch-a: #122c4f; --swatch-b: #fbf9e4;">
            <span class="theme-swatch"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Firebase configuration & Initialization -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBU7Bs4P7M_kTkc2bs0rWnjEClQhFUHVrg",
        authDomain: "php-login-page-cfb77.firebaseapp.com",
        projectId: "php-login-page-cfb77",
        storageBucket: "php-login-page-cfb77.firebasestorage.app",
        messagingSenderId: "347270214304",
        appId: "1:347270214304:web:ec0204f802cd85c0b14fc5",
        measurementId: "G-6JL362S1PC"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Expose Firebase to window for app.js
      window.auth = auth;
      window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
      window.signInWithEmailAndPassword = signInWithEmailAndPassword;
      window.updateProfile = updateProfile;
    </script>

    <script type="module" src="./app.js"></script>
  </body>
</html>
